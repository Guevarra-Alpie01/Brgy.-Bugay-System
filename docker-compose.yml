services:
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: bugay-onlyoffice
    ports:
      - "8080:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Set ONLYOFFICE_JWT_SECRET in .env}
      JWT_HEADER: Authorization
    restart: unless-stopped
